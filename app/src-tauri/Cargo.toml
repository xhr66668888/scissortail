[package]
name = "scissortail-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scissortail — articulatory kinematics workbench"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
base64 = "0.22"

# The speech aligner runs on ONNX Runtime on Apple-silicon Macs (the validated
# build) and on tract, pure Rust, everywhere else: ONNX Runtime does not load
# on Windows 7 and is no longer published for Intel Macs.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
scissortail-core = { path = "../../crates/scissortail-core" }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
scissortail-core = { path = "../../crates/scissortail-core", default-features = false, features = ["tract"] }
